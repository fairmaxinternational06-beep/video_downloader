<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VidSave - Premium Video Downloader</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- වම් පැත්තේ Ad එක (160x300 Banner එක) -->
    <div class="ad-left">
       <!-- ඔබේ Adsterra 160x300 Banner කේතය මෙතනට දාන්න -->
    </div>

    <!-- දකුණු පැත්තේ Ad එක (160x300 Banner එක) -->
    <div class="ad-right">
       <!-- ඔබේ Adsterra 160x300 Banner කේතය මෙතනට දාන්න -->
    </div>

    <!-- ප්‍රධාන UI එක -->
    <div class="container">
        <h1>VidSave</h1>
        <p>Download your favorite videos from YouTube, TikTok & Facebook easily.</p>
        
        <div class="input-group">
            <input type="url" id="videoUrl" placeholder="Paste video link here..." required>
            <button onclick="fetchVideo()">Search</button>
        </div>

        <div class="loader" id="loader"></div>

        <div class="preview-box" id="previewBox">
            <img src="https://via.placeholder.com/600x320/0f172a/6366f1?text=Video+Ready" alt="Thumbnail" id="videoThumbnail">
            <div class="video-title" id="videoTitle">Ready to download your video!</div>
            
            <button class="download-btn" id="downloadBtn" onclick="handleDownload()">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                Download Video
            </button>
        </div>
    </div>

    <!-- යටින් එන Ad එක (අවශ්‍ය නම් පමණක් යොදන්න) -->
    <div class="ad-bottom">
        
    </div>

    <div class="footer">
        © 2026 VidSave. All rights reserved.
    </div>

    <script src="script.js"></script>
    
    <!-- Phone සහ Desktop දෙකටම වැඩ කරන Floating Ads (Social Bar) -->
    <!-- ඔබේ Adsterra Social Bar Script එක මෙතනට දාන්න -->
        
</body>
</html>
